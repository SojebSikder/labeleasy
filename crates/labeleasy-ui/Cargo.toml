[package]
name = "labeleasy-ui"
description = "Reusable iced building blocks: Zed-compatible themes, custom titlebar, menus, modals, toasts, virtual lists"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
iced.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
